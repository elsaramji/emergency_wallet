<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Cash - Authentication Preview</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .header-section {
            margin-top: 20px;
            margin-bottom: 40px;
        }
        .form-section {
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .login-link {
            text-align: center;
            margin-top: 24px;
            font-size: 15px;
        }
        .login-link a {
            color: var(--color-primary);
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s;
        }
        .login-link a:hover {
            color: var(--color-primary-dark);
            text-decoration: underline;
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 30px 0;
            color: var(--color-text-muted);
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-top: 1px solid var(--color-border);
        }
        .divider::before { margin-right: 16px; }
        .divider::after { margin-left: 16px; }
    </style>
</head>
<body>
    <div class="iphone-mockup">
        <div class="glass-bg">
            <div class="glass-blob blob-1"></div>
            <div class="glass-blob blob-2"></div>
        </div>
        
        <div class="status-bar">
            <span>9:41</span>
            <div class="status-icons">
                <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M11.6667 0H14.5833C15.3888 0 16.0417 0.652876 16.0417 1.45833V8.75C16.0417 9.55546 15.3888 10.2083 14.5833 10.2083H11.6667C10.8612 10.2083 10.2083 9.55546 10.2083 8.75V1.45833C10.2083 0.652876 10.8612 0 11.6667 0Z"/><path d="M5.83333 2.91667H8.75C9.55546 2.91667 10.2083 3.56954 10.2083 4.375V8.75C10.2083 9.55546 9.55546 10.2083 8.75 10.2083H5.83333C5.02788 10.2083 4.375 9.55546 4.375 8.75V4.375C4.375 3.56954 5.02788 2.91667 5.83333 2.91667Z"/><path d="M0 5.83333H2.91667C3.72212 5.83333 4.375 6.48621 4.375 7.29167V8.75C4.375 9.55546 3.72212 10.2083 2.91667 10.2083H0C0 9.40284 0 8.75 0 8.75V5.83333Z"/></svg>
                <span style="margin-left:5px"></span>
                <svg width="25" height="12" viewBox="0 0 25 12" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><rect x="1" y="1" width="21" height="10" rx="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M24 4V8C24 8.55228 23.5523 9 23 9H22V3H23C23.5523 3 24 3.44772 24 4Z" fill="currentColor"/><rect x="3" y="3" width="14" height="6" rx="1.5" fill="currentColor"/></svg>
            </div>
        </div>
        
        <div class="screen-content">
            <div class="header-section fade-up">
                <h1 class="title-lg">Create Account</h1>
                <p class="subtitle">Start tracking and protecting your money today.</p>
            </div>
            
            <form class="form-section fade-up delay-1">
                <div class="input-group">
                    <label class="input-label">Full Name</label>
                    <input type="text" class="input-field" placeholder="e.g. Ahmed Hassan">
                </div>
                
                <div class="input-group">
                    <label class="input-label">Phone Number</label>
                    <input type="tel" class="input-field" placeholder="01X XXXX XXXX">
                </div>
                
                <div class="input-group">
                    <label class="input-label">Password</label>
                    <div style="position: relative;">
                        <input type="password" class="input-field" placeholder="••••••••">
                        <span style="position: absolute; right: 16px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--color-text-muted);">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </span>
                    </div>
                </div>
                
                <div style="margin-top: 32px;">
                    <button type="button" class="btn btn-primary fade-up delay-2">Create Account</button>
                </div>
                
                <div class="login-link fade-up delay-3">
                    <p>Already have an account? <a href="#">Log In</a></p>
                </div>
            </form>
            
            <div class="fade-up delay-4" style="margin-top: auto; padding-bottom: 20px;">
                <div class="divider">Or register with</div>
                <button type="button" class="btn btn-outline" style="display: flex; gap: 12px; background: white;">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                    Continue with Google
                </button>
            </div>
        </div>
    </div>
</body>
</html>
